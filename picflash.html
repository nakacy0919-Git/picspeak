<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pic Flash - PicSpeak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', 'Noto Sans JP', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #fdf2f8; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 4px; }
        
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        @keyframes practiceSuccess {
            0% { transform: scale(0.5) translateY(20px); opacity: 0; }
            20% { transform: scale(1.5) translateY(-20px); opacity: 1; }
            80% { transform: scale(1.5) translateY(-20px); opacity: 1; }
            100% { transform: scale(1) translateY(-40px); opacity: 0; }
        }
        .animate-practice-success { animation: practiceSuccess 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .card-level-1 { border-color: #86efac !important; box-shadow: 0 0 20px rgba(134, 239, 172, 0.3); }

        @keyframes popCheck {
            0% { transform: scale(0.3); opacity: 0; }
            40% { transform: scale(1.2); opacity: 1; }
            70% { transform: scale(1.0); opacity: 1; }
            100% { transform: scale(1.0); opacity: 0; }
        }
        .animate-pop-check { animation: popCheck 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes comboFire {
            0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            20% { transform: scale(1.2) rotate(5deg); opacity: 1; filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.8)); }
            80% { transform: scale(1.0) rotate(0deg); opacity: 1; filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.5)); }
            100% { transform: scale(1.5) translateY(-50px); opacity: 0; }
        }
        .animate-combo-fire { animation: comboFire 1.2s ease-out forwards; }
        
        .hint-char-reveal { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="bg-pink-50 text-gray-800 overflow-x-hidden w-full h-full relative selection:bg-pink-200">

    <div class="app-container w-full min-h-screen relative flex flex-col max-w-7xl mx-auto bg-white/80 backdrop-blur-sm shadow-2xl">
        
        <div id="view-picflash-select" class="flex flex-col items-center justify-start min-h-[80vh] w-full px-4 md:px-8 pt-8 pb-20 relative max-w-5xl mx-auto">
            <div class="w-full flex items-center justify-between mb-10">
                <button onclick="window.location.href='index.html'" class="w-12 h-12 md:w-16 md:h-16 bg-white rounded-full flex items-center justify-center text-2xl md:text-3xl shadow-sm border border-gray-200 hover:bg-pink-50 hover:text-pink-500 transition-colors">◀</button>
                <h2 class="text-3xl md:text-4xl lg:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500 tracking-widest italic">⚡️ PIC FLASH</h2>
                <div class="w-12 md:w-16"></div>
            </div>

            <div class="w-full mb-3 pl-2 flex justify-between items-end">
                <h3 class="text-base md:text-lg lg:text-xl font-black text-gray-600 uppercase tracking-widest">1. 話す言語を選ぶ (複数選択OK!)</h3>
            </div>
            <div class="w-full bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-gray-200 mb-8">
                <div id="pf-lang-checkboxes" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 max-h-56 overflow-y-auto custom-scrollbar pr-2"></div>
            </div>

            <div class="w-full mb-3 pl-2"><h3 class="text-base md:text-lg lg:text-xl font-black text-gray-600 uppercase tracking-widest">2. モードを選ぶ</h3></div>
            <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <button class="pf-mode-btn bg-white border-4 border-transparent hover:border-pink-300 text-gray-700 py-6 md:py-8 rounded-3xl flex flex-col items-center justify-center transition-all shadow-sm group" data-mode="practice">
                    <span class="text-4xl md:text-5xl mb-2 group-hover:scale-110 transition-transform">📖</span>
                    <span class="text-xl md:text-2xl lg:text-3xl font-black tracking-wider">学習モード</span>
                    <span class="text-sm md:text-base font-bold text-gray-500 mt-2">発音と意味をじっくり確認</span>
                </button>
                <button class="pf-mode-btn bg-white border-4 border-transparent hover:border-pink-300 text-gray-700 py-6 md:py-8 rounded-3xl flex flex-col items-center justify-center transition-all shadow-sm group" data-mode="trial">
                    <span class="text-4xl md:text-5xl mb-2 group-hover:scale-110 transition-transform">⏱️</span>
                    <span class="text-xl md:text-2xl lg:text-3xl font-black tracking-wider">タイムアタック</span>
                    <span class="text-sm md:text-base font-bold text-gray-500 mt-2">複数言語を連続でクリアせよ！</span>
                </button>
            </div>

            <div id="section-trial-settings" class="hidden w-full transition-all duration-300">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full mb-8">
                    <div>
                        <div class="w-full mb-3 pl-2"><h3 class="text-base md:text-lg lg:text-xl font-black text-gray-600 uppercase tracking-widest">3. 問題数</h3></div>
                        <div class="w-full bg-white p-3 rounded-3xl shadow-sm border border-gray-200 flex gap-2">
                            <button class="pf-count-btn flex-1 py-3 md:py-4 rounded-2xl font-black text-base md:text-xl transition-all bg-gradient-to-br from-pink-400 to-rose-400 text-white shadow-md transform scale-105" data-count="10">10</button>
                            <button class="pf-count-btn flex-1 py-3 md:py-4 rounded-2xl font-black text-base md:text-xl transition-all bg-gray-50 text-gray-400 border-2 border-transparent" data-count="20">20</button>
                            <button class="pf-count-btn flex-1 py-3 md:py-4 rounded-2xl font-black text-base md:text-xl transition-all bg-gray-50 text-gray-400 border-2 border-transparent" data-count="ALL">ALL</button>
                        </div>
                    </div>
                    <div>
                        <div class="w-full mb-3 pl-2"><h3 class="text-base md:text-lg lg:text-xl font-black text-gray-600 uppercase tracking-widest">4. 1言語の制限時間</h3></div>
                        <div class="w-full bg-white p-3 rounded-3xl shadow-sm border border-gray-200 flex gap-2">
                            <button class="pf-time-btn flex-1 py-3 md:py-4 rounded-2xl font-black text-base md:text-lg transition-all bg-gray-50 text-gray-400 border-2 border-transparent" data-time="3">3秒</button>
                            <button class="pf-time-btn flex-1 py-3 md:py-4 rounded-2xl font-black text-base md:text-lg transition-all bg-gradient-to-br from-purple-400 to-indigo-400 text-white shadow-md transform scale-105" data-time="5">5秒</button>
                            <button class="pf-time-btn flex-1 py-3 md:py-4 rounded-2xl font-black text-base md:text-lg transition-all bg-gray-50 text-gray-400 border-2 border-transparent" data-time="10">10秒</button>
                            <button class="pf-time-btn flex-1 py-3 md:py-4 rounded-2xl font-black text-xs md:text-sm transition-all bg-gray-50 text-gray-400 border-2 border-transparent" data-time="none">無制限</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="w-full mb-3 pl-2"><h3 id="title-category-select" class="text-base md:text-lg lg:text-xl font-black text-gray-600 uppercase tracking-widest">3. ジャンルを選ぶ</h3></div>
            <div id="pf-category-grid" class="w-full grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-12"></div>
        </div>

        <div id="view-picflash-practice" class="hidden flex flex-col items-center justify-start min-h-screen w-full px-4 md:px-8 pt-8 pb-20 relative max-w-6xl mx-auto">
            <div class="w-full flex items-center justify-between mb-8">
                <button onclick="showPfView('view-picflash-select')" class="w-12 h-12 md:w-16 md:h-16 bg-white rounded-full flex items-center justify-center text-2xl shadow-sm border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors">✖</button>
                <h2 class="text-2xl md:text-3xl lg:text-4xl font-black text-gray-700 tracking-widest">📖 学習モード (一覧)</h2>
                <div class="w-12 md:w-16"></div>
            </div>
            <div id="pf-practice-grid" class="w-full grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 pb-10"></div>
        </div>

        <div id="view-picflash-play" class="hidden flex flex-col items-center justify-start h-[100dvh] w-full px-4 md:px-8 pt-4 pb-6 relative max-w-7xl mx-auto overflow-hidden">
            
            <div id="pf-start-overlay" class="absolute inset-0 z-[150] bg-white/95 backdrop-blur-md flex flex-col items-center justify-center">
                <h3 class="text-3xl md:text-5xl font-black text-gray-700 mb-8 tracking-widest">ARE YOU READY?</h3>
                <button id="btn-pf-real-start" class="w-[80%] max-w-md py-6 md:py-8 rounded-[2rem] bg-gradient-to-r from-pink-500 to-purple-500 text-white font-black text-3xl md:text-4xl shadow-xl hover:shadow-2xl transform hover:-translate-y-1 transition-all tracking-widest">
                    START 🚀
                </button>
            </div>

            <div class="w-full flex items-center justify-between bg-white px-4 md:px-8 py-3 rounded-full shadow-sm mb-4 border border-gray-200 shrink-0 z-20">
                <div class="flex flex-col gap-1 flex-1">
                    <div class="font-black text-gray-400 text-xs md:text-sm tracking-widest leading-none flex items-center gap-2">
                        <span id="pf-card-count" class="text-gray-700 font-black text-lg md:text-xl">1</span> / <span id="pf-total-count">10</span>
                        <span class="bg-gray-100 px-2 py-0.5 rounded text-[10px]">PROGRESS</span>
                    </div>
                    <div id="pf-progress-lamps" class="flex flex-wrap gap-1 md:gap-1.5 mt-1"></div>
                </div>
                <div class="font-black text-3xl md:text-5xl text-gray-800 tabular-nums leading-none mx-4 text-center"><span id="pf-timer">00.00</span><span class="text-lg text-gray-400 ml-1">s</span></div>
                <button id="btn-pf-quit" class="w-10 h-10 md:w-14 md:h-14 bg-gray-100 rounded-full flex items-center justify-center font-black text-gray-500 hover:bg-red-50 hover:text-red-500 text-xl transition-colors shrink-0">✖</button>
            </div>

            <div id="pf-card-timer-container" class="w-full bg-gray-200 h-2 rounded-full mb-4 overflow-hidden shadow-inner shrink-0 hidden">
                <div id="pf-card-timer-bar" class="h-full bg-gradient-to-r from-purple-400 to-pink-500 w-full transition-all ease-linear"></div>
            </div>

            <div class="w-full flex flex-col md:flex-row gap-4 md:gap-6 flex-1 overflow-hidden">
                
                <div class="relative w-full md:w-3/5 lg:w-1/2 flex-1 bg-white rounded-[2rem] shadow-xl border-4 md:border-8 overflow-hidden transform transition-all duration-300 card-level-1 z-10 flex items-center justify-center" id="pf-card">
                    <img id="pf-image" src="" class="absolute inset-0 w-full h-full object-contain p-4 md:p-8 drop-shadow-md">
                    
                    <div id="pf-overlay-correct" class="hidden absolute inset-0 bg-white/50 backdrop-blur-sm flex items-center justify-center z-10"><span class="text-8xl md:text-[12rem] transform scale-150 animate-pop">⭕️</span></div>
                    <div id="pf-overlay-skip" class="hidden absolute inset-0 bg-red-500/20 backdrop-blur-sm flex flex-col items-center justify-center z-10"></div>
                    
                    <div id="pf-combo-anim" class="hidden absolute inset-0 z-20 flex flex-col items-center justify-center pointer-events-none">
                        <span id="pf-combo-text" class="text-5xl md:text-7xl font-black text-red-500 tracking-tighter uppercase drop-shadow-2xl"></span>
                    </div>

                    <div id="correct-answer-anim" class="hidden absolute inset-0 z-[100] flex items-center justify-center pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-32 h-32 md:w-48 md:h-48 drop-shadow-2xl">
                            <circle cx="50" cy="50" r="45" fill="#22c55e" />
                            <path d="M30 50 L45 65 L70 30" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>

                <div class="w-full md:w-2/5 lg:w-1/2 flex flex-col gap-3 z-20 h-full overflow-y-auto pb-4 custom-scrollbar">
                    
                    <div id="pf-trial-steps-container" class="bg-white border border-gray-200 rounded-3xl p-4 shadow-sm flex flex-col gap-2 shrink-0">
                        <div class="text-[10px] md:text-xs font-bold text-gray-400 uppercase tracking-widest text-center">🎯 Languages to clear</div>
                        <div id="pf-trial-steps" class="flex flex-col gap-2 mt-1"></div>
                    </div>

                    <div class="bg-white border border-pink-100 rounded-3xl p-4 md:p-6 shadow-sm flex flex-col justify-center items-center shrink-0 min-h-[140px]">
                        <div class="text-[10px] md:text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">💡 HINT (MEANING)</div>
                        <div id="pf-hint-meaning" class="text-lg md:text-2xl lg:text-3xl font-black text-gray-700 mb-3 text-center"></div>
                        <div id="pf-hint-squares" class="flex flex-wrap justify-center gap-1.5 md:gap-2"></div>
                    </div>

                    <div class="w-full bg-gray-50 border-2 border-pink-200 rounded-3xl p-4 md:p-6 flex flex-col items-center justify-center shadow-inner flex-1 min-h-[120px]">
                        <div class="relative flex h-8 w-8 shrink-0 mb-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-full w-full bg-pink-500 items-center justify-center text-white text-lg">🎙</span>
                        </div>
                        <div class="font-bold text-gray-600 text-xl md:text-2xl text-center break-words w-full" id="pf-status-text">Ready...</div>
                    </div>

                    <div class="shrink-0 flex flex-col items-center">
                        <div class="text-[10px] md:text-xs font-bold text-pink-400 mb-1">💡 わからない時は「Skip」でパス（+2秒ペナルティ）</div>
                        <button id="btn-pf-skip" class="py-3 md:py-4 bg-white text-gray-500 font-black text-lg md:text-xl rounded-2xl shadow-sm hover:bg-gray-50 border border-gray-200 w-full transition-transform active:scale-95">Skip ⏭️</button>
                    </div>
                </div>

            </div>
        </div>

        <div id="view-picflash-result" class="hidden flex flex-col items-center justify-center min-h-screen w-full px-4 pt-10 pb-20 relative max-w-4xl mx-auto">
            <h2 class="text-3xl md:text-4xl lg:text-5xl font-black text-gray-400 tracking-widest uppercase mb-6">Result</h2>
            
            <div id="pf-pb-badge" class="hidden absolute top-20 md:top-24 bg-gradient-to-r from-yellow-300 via-yellow-400 to-yellow-500 text-yellow-900 font-black px-8 py-2 md:py-3 rounded-full shadow-[0_0_20px_rgba(250,204,21,0.8)] border-4 border-yellow-100 transform -rotate-2 animate-bounce z-20 text-xl md:text-3xl tracking-widest">
                🎉 自己ベスト更新！ 🎉
            </div>

            <div id="pf-result-box" class="w-full bg-gradient-to-br from-pink-500 to-rose-400 rounded-[3rem] p-8 md:p-12 flex flex-col items-center shadow-xl text-white mb-8 relative overflow-hidden transition-colors duration-500">
                <span class="text-white/90 font-extrabold text-lg md:text-xl tracking-widest mb-2 uppercase">クリアタイム</span>
                <div class="flex items-baseline gap-2"><span class="text-7xl md:text-[7rem] lg:text-[8rem] font-black leading-none" id="pf-final-time">00.00</span><span class="text-3xl md:text-4xl font-bold">s</span></div>
            </div>
            
            <div class="w-full bg-white rounded-3xl p-6 shadow-sm border border-gray-200 mb-8 max-w-2xl">
                <h3 class="text-sm font-black text-gray-400 uppercase tracking-widest mb-4 border-b border-gray-100 pb-2 flex items-center justify-between">
                    <span>⏱️ あなたの記録 (直近)</span>
                </h3>
                <div id="pf-history-list" class="flex flex-col gap-1 max-h-48 overflow-y-auto custom-scrollbar pr-2"></div>
            </div>

            <button onclick="showPfView('view-picflash-select')" class="w-full max-w-md py-5 md:py-6 rounded-3xl bg-white text-gray-700 font-black text-xl md:text-2xl shadow-sm border border-gray-200 hover:bg-gray-50 transition-colors">トップに戻る</button>
        </div>
    </div>

    <!-- Practiceモーダル -->
    <div id="pf-practice-modal" class="hidden fixed inset-0 z-[100] flex items-start justify-center bg-gray-900/60 backdrop-blur-sm p-2 md:p-6 overflow-y-auto custom-scrollbar">
        <div class="bg-white rounded-[2rem] w-full max-w-5xl relative shadow-2xl p-6 md:p-8 border border-gray-100 transform transition-all mt-0 mb-10">
            <button onclick="closePracticeModal()" class="absolute top-4 right-4 md:top-6 md:right-6 w-10 h-10 md:w-12 md:h-12 bg-gray-100 rounded-full flex items-center justify-center font-black text-gray-500 hover:bg-pink-100 hover:text-pink-500 transition-colors z-[110] text-xl shadow-sm">✖</button>
            <div id="pf-practice-modal-content" class="w-full mt-6 md:mt-2"></div>
            <div id="pf-practice-success-anim" class="hidden absolute inset-0 pointer-events-none flex items-center justify-center z-[120]"><span class="text-[10rem] md:text-[15rem] drop-shadow-2xl">🌟✨</span></div>
        </div>
    </div>

    <script src="js/picflash.js"></script>
</body>
</html>
